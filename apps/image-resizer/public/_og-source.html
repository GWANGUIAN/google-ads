<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #92400e 0%, #d97706 45%, #fbbf24 100%);
    position: relative;
    width: 1200px;
    height: 630px;
  }
  .title {
    position: absolute;
    left: 90px;
    top: 180px;
    font-size: 70px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -1px;
    line-height: 1;
  }
  .subtitle {
    position: absolute;
    left: 90px;
    top: 270px;
    width: 620px;
    font-size: 27px;
    font-weight: 400;
    color: rgba(255,255,255,0.92);
    line-height: 1.45;
  }
  .badge {
    position: absolute;
    left: 90px;
    bottom: 60px;
    padding: 14px 26px;
    background: rgba(255,255,255,0.18);
    border-radius: 999px;
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
  }
  .card {
    position: absolute;
    right: 120px;
    top: 158px;
    width: 220px;
    height: 220px;
    border-radius: 28px;
    background: rgba(255,255,255,0.16);
    transform: rotate(8deg);
  }
  .card2 {
    position: absolute;
    right: 140px;
    top: 172px;
    width: 220px;
    height: 220px;
    border-radius: 28px;
    background: #fffbeb;
    box-shadow: 0 30px 60px rgba(51, 28, 3, 0.35);
  }
  .frame {
    position: absolute;
    top: 40px;
    left: 40px;
    width: 140px;
    height: 140px;
    border: 4px dashed #d97706;
    border-radius: 12px;
  }
  .handle {
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: #d97706;
  }
  .h-tl { top: -11px; left: -11px; }
  .h-tr { top: -11px; right: -11px; }
  .h-bl { bottom: -11px; left: -11px; }
  .h-br { bottom: -11px; right: -11px; }
</style>
</head>
<body>
  <div class="card"></div>
  <div class="card2">
    <div class="frame">
      <div class="handle h-tl"></div>
      <div class="handle h-tr"></div>
      <div class="handle h-bl"></div>
      <div class="handle h-br"></div>
    </div>
  </div>

  <div class="title">Image Resizer</div>
  <div class="subtitle">Resize any image to an exact size or a preset, right in your browser</div>
  <div class="badge">Part of LoomFile &middot; loomfile.com/resize</div>
</body>
</html>
