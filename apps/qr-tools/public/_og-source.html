<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0e7490 0%, #0891b2 45%, #22d3ee 100%);
    position: relative;
    width: 1200px;
    height: 630px;
  }
  .title {
    position: absolute;
    left: 90px;
    top: 180px;
    font-size: 74px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -1px;
    line-height: 1;
  }
  .subtitle {
    position: absolute;
    left: 90px;
    top: 270px;
    width: 620px;
    font-size: 27px;
    font-weight: 400;
    color: rgba(255,255,255,0.92);
    line-height: 1.45;
  }
  .badge {
    position: absolute;
    left: 90px;
    bottom: 60px;
    padding: 14px 26px;
    background: rgba(255,255,255,0.18);
    border-radius: 999px;
    font-size: 20px;
    font-weight: 700;
    color: #ffffff;
  }
  .card {
    position: absolute;
    right: 120px;
    top: 158px;
    width: 220px;
    height: 220px;
    border-radius: 28px;
    background: rgba(255,255,255,0.16);
    transform: rotate(8deg);
  }
  .card2 {
    position: absolute;
    right: 140px;
    top: 172px;
    width: 220px;
    height: 220px;
    border-radius: 28px;
    background: #ecfeff;
    box-shadow: 0 30px 60px rgba(3, 40, 51, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qr-grid {
    width: 168px;
    height: 168px;
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    gap: 3px;
  }
  .cell { background: transparent; border-radius: 2px; }
  .on { background: #0e7490; }
</style>
</head>
<body>
  <div class="card"></div>
  <div class="card2">
    <div class="qr-grid" id="grid"></div>
  </div>

  <div class="title">QR Code Tools</div>
  <div class="subtitle">Generate &amp; scan QR codes, right in your browser</div>
  <div class="badge">Part of LoomFile &middot; loomfile.com/qr</div>

  <script>
    // 9x9 pattern with classic QR finder squares at three corners plus a
    // scattering of filled modules, purely for visual representation.
    const on = new Set();
    function finder(r0, c0) {
      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          const isRing = r === 0 || r === 4 || c === 0 || c === 4;
          const isCore = r >= 1 && r <= 3 && c >= 1 && c <= 3 && !(r === 2 && c === 2 ? false : (r === 1 || r === 3 || c === 1 || c === 3));
          if (isRing || (r >= 1 && r <= 3 && c >= 1 && c <= 3 && r === 2 && c === 2)) {
            on.add(`${r0 + r}-${c0 + c}`);
          }
        }
      }
    }
    finder(0, 0);
    finder(0, 4);
    finder(4, 0);

    const sparse = [
      [1,6],[2,7],[3,6],[3,8],
      [5,1],[5,3],[6,2],[7,1],[7,3],[8,2],
      [5,5],[5,7],[6,6],[6,8],[7,5],[7,7],[8,6],[8,8],
      [4,7],[4,8]
    ];
    sparse.forEach(([r,c]) => on.add(`${r}-${c}`));

    const grid = document.getElementById("grid");
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        const div = document.createElement("div");
        div.className = "cell" + (on.has(`${r}-${c}`) ? " on" : "");
        grid.appendChild(div);
      }
    }
  </script>
</body>
</html>
