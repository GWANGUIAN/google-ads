name: Deploy loomfile

# Deploys every tool on the loomfile.com umbrella domain. Each contributing
# app builds normally (with its own Astro `base` path where applicable), then
# their dist/ folders are merged into one directory and shipped as a single
# Cloudflare Pages deploy — no Cloudflare Worker, so this stays outside the
# Workers request quota just like every other site in this repo. Add a new
# `cp -r apps/<tool>/dist/. merged-dist/<path>/` line (and a paths: entry
# above) each time a new tool joins this domain. See docs/NEW_SITE_PLAYBOOK.md §11.

on:
  push:
    branches: [main]
    paths:
      - "apps/loomfile/**"
      - "apps/localpdf/**"
      - "apps/video-tools/**"
      - "apps/img-convertor/**"
      - "apps/font-tools/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-loomfile.yml"
  workflow_dispatch:

concurrency:
  group: deploy-loomfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: loomfile
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build loomfile (root) and every tool mounted under it
        run: pnpm turbo run build --filter=loomfile... --filter=localpdf... --filter=video-tools... --filter=img-convertor... --filter=font-tools...
        env:
          # img-convertor is also built standalone by deploy-img-convertor.yml
          # for imgconvertor.download; this PUBLIC_BASE_PATH only applies here,
          # mounting the same app at loomfile.com/image-convertor instead. It's
          # harmless to pass to localpdf/video-tools too — their configs don't
          # read it (their base is hardcoded per-app). See NEW_SITE_PLAYBOOK.md §11.
          PUBLIC_BASE_PATH: /image-convertor
          # Astro bakes PUBLIC_* vars into the static build at build time, so
          # they must be provided here (GitHub Actions), not in the Cloudflare
          # Pages dashboard — this repo builds via CI and ships a finished
          # dist/, Cloudflare's own build/env-var system is never invoked.
          # These are not secrets (they end up in public page HTML once ads
          # are on). Domain-specific ones (site URL, ads on/off, search
          # verification codes) live in the `loomfile` GitHub Environment
          # above, NOT as repo-level Variables — a repo-level Variable is
          # shared by every site's workflow, which silently breaks the moment
          # a second site's workflow reads the same name expecting a
          # different value (this is why img-convertor and loomfile don't
          # just reuse one PUBLIC_SITE_URL). Only PUBLIC_ADSENSE_CLIENT_ID
          # (one AdSense account, safe to share) stays at the repo level.
          #   gh variable set PUBLIC_ADS_ENABLED --env loomfile --body true
          # Every tool on this domain (loomfile, localpdf, ...) shares this
          # one environment's values, since they're all the same domain.
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_ADS_ENABLED: ${{ vars.PUBLIC_ADS_ENABLED }}
          PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.PUBLIC_ADSENSE_CLIENT_ID }}
          PUBLIC_AD_SLOT_HEADER: ${{ vars.PUBLIC_AD_SLOT_HEADER }}
          PUBLIC_AD_SLOT_IN_CONTENT: ${{ vars.PUBLIC_AD_SLOT_IN_CONTENT }}
          PUBLIC_AD_SLOT_SIDEBAR: ${{ vars.PUBLIC_AD_SLOT_SIDEBAR }}
          PUBLIC_AD_SLOT_FOOTER: ${{ vars.PUBLIC_AD_SLOT_FOOTER }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_NAVER_SITE_VERIFICATION: ${{ vars.PUBLIC_NAVER_SITE_VERIFICATION }}
          PUBLIC_BING_SITE_VERIFICATION: ${{ vars.PUBLIC_BING_SITE_VERIFICATION }}

      - name: Merge each tool's dist under its path
        run: |
          rm -rf merged-dist
          mkdir -p merged-dist
          cp -r apps/loomfile/dist/. merged-dist/
          mkdir -p merged-dist/pdf
          cp -r apps/localpdf/dist/. merged-dist/pdf/
          mkdir -p merged-dist/video
          cp -r apps/video-tools/dist/. merged-dist/video/
          mkdir -p merged-dist/image-convertor
          cp -r apps/img-convertor/dist/. merged-dist/image-convertor/
          mkdir -p merged-dist/font
          cp -r apps/font-tools/dist/. merged-dist/font/

      - name: Regenerate consolidated sitemap index
        run: node apps/loomfile/scripts/generate-sitemap-index.mjs merged-dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy merged-dist --project-name=loomfile --branch=main
